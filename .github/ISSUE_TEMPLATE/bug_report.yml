name: Bug 报告
description: 报告可复现的页梭问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先删除代理密码、UUID、订阅地址和其他凭据。
  - type: input
    id: version
    attributes:
      label: 页梭版本
      placeholder: v0.6.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 24H2 / macOS 15 arm64 / Chrome 140
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 导入… 2. 点击… 3. 出现…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
