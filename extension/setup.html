  <main class="setup-card">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M12 2.4 20 5.9v5.3c0 5.1-3.4 9.3-8 10.4-4.6-1.1-8-5.3-8-10.4V5.9L12 2.4Z"/><path d="m8.4 12 2.2 2.2 5-5"/></svg></div>
    <p class="eyebrow">PAGE SHUTTLE</p>
    <h1>还差一步即可启动页梭</h1>
    <p class="lead">Chrome 出于安全考虑，不允许扩展直接运行电脑中的本地安装脚本。首次使用需要你手动确认一次。</p>
    <ol>
      <li><span>1</span><div><b>返回解压后的页梭安装包</b><small>例如：页梭-v0.6.1 文件夹</small></div></li>
      <li><span>2</span><div><b>运行对应系统的安装脚本</b><small>Windows 双击 .cmd；macOS 右键打开 .command</small></div></li>
      <li><span>3</span><div><b>回到扩展，再点「启动」</b><small>以后的启动和暂停都可在扩展内完成</small></div></li>
    </ol>
    <div class="safe-note"><b>安全边界</b><span>本地助手只监听 127.0.0.1；不安装系统服务、TUN 或防火墙规则。</span></div>
